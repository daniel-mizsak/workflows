---
name: Prek

on:
  workflow_call:
    inputs:
      extra-args:
        description: "Additional arguments for prek"
        default: "--all-files"
        type: string
      skip:
        description: "Comma-separated list of hooks or projects to skip"
        required: false
        type: string

permissions: {}

jobs:
  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          ignore-nothing-to-cache: true

      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          extra-args: "${{ inputs.extra-args }}"
        env:
          PREK_SKIP: ${{ inputs.skip }}
