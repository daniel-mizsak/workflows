---
name: Prek

on:
  workflow_call:
    inputs:
      extra-args:
        description: "Additional arguments for prek"
        default: "--all-files"
        type: string
      skip:
        description: "Comma-separated list of hooks or projects to skip"
        required: false
        type: string

permissions: {}

jobs:
  prek:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          ignore-nothing-to-cache: true

      - name: Run prek
        uses: j178/prek-action@af4d4fcb6922b8e6f65c0426947125fcc38794ce # v3.0.2
        with:
          extra-args: "${{ inputs.extra-args }}"
        env:
          PREK_SKIP: ${{ inputs.skip }}
